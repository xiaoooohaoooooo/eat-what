<title>今天吃什么 v1.1 · 随机决定器</title>
<style>
  :root{
    --bg:#140a06; --bg2:#2a1408; --card:rgba(58,28,12,.62);
    --org:#ff8c2b; --red:#ff4d4d; --gold:#ffd166; --green:#5ec26a; --blue:#5ea9ff;
    --text:#ffeee0; --dim:#c0a08a; --line:rgba(255,140,43,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;max-width:100vw;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    display:flex;justify-content:center;padding:18px 14px 40px}
  .bg{position:fixed;inset:0;z-index:-2;background:
    radial-gradient(900px 600px at 15% -10%,rgba(255,140,43,.28),transparent 60%),
    radial-gradient(800px 600px at 90% 10%,rgba(255,77,77,.20),transparent 60%),
    radial-gradient(700px 700px at 50% 115%,rgba(255,209,102,.16),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg))}
  .grid{position:fixed;inset:0;z-index:-1;opacity:.12;
    background-image:linear-gradient(rgba(255,140,43,.5) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,140,43,.5) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(circle at 50% 35%,#000 20%,transparent 78%);
    mask-image:radial-gradient(circle at 50% 35%,#000 20%,transparent 78%)}
  .wrap{width:100%;max-width:620px;min-width:0;overflow-x:hidden}
  header{text-align:center;margin-bottom:16px}
  .brand{font-size:12px;letter-spacing:.42em;color:var(--dim)}
  h1{margin:6px 0 0;font-size:24px;font-weight:800;letter-spacing:.05em;
    background:linear-gradient(92deg,var(--gold),var(--org),var(--red));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,140,43,.5))}
  .sub{margin-top:6px;font-size:11.5px;color:var(--dim)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 14px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
    padding:16px;margin-bottom:14px}
  .stage{position:relative;text-align:center;padding:24px 14px 20px;overflow:hidden;border-radius:18px;
    background:linear-gradient(160deg,rgba(255,140,43,.18),rgba(255,77,77,.07));
    border:1px solid var(--line);margin-bottom:12px}
  .stage::after{content:"";position:absolute;inset:-40%;
    background:conic-gradient(from 0deg,transparent 0deg,rgba(255,140,43,.18) 60deg,transparent 130deg);
    animation:spin 7s linear infinite;z-index:0;opacity:0;transition:opacity .3s}
  .stage.rolling::after{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  .stage>*{position:relative;z-index:1}
  .food{font-size:29px;font-weight:900;line-height:1.25;min-height:38px;
    word-break:break-word;transition:color .2s}
  .meta{display:flex;align-items:center;justify-content:center;gap:8px;margin:9px 0 4px;flex-wrap:wrap}
  .chipm{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18);color:var(--dim)}
  .chipm.scene{color:var(--blue);border-color:rgba(94,169,255,.5)}
  .price{font-size:12px;font-weight:800;color:var(--gold)}
  .combo{font-size:12.5px;color:var(--dim);min-height:18px;margin-top:6px;letter-spacing:.02em}
  .tagline{font-size:12px;color:var(--dim);min-height:17px;margin-top:8px}
  .stage.hit{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.04)}100%{transform:scale(1)}}
  .burst{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;opacity:0;
    background:radial-gradient(circle,#fff,rgba(255,255,255,0) 68%)}
  .burst.go{animation:burst .6s ease-out}
  @keyframes burst{0%{opacity:.95;width:12px;height:12px}100%{opacity:0;width:540px;height:540px}}
  .draw{width:100%;border:none;border-radius:16px;padding:19px;cursor:pointer;
    font-size:20px;font-weight:900;letter-spacing:.2em;color:#fff;font-family:inherit;
    background:linear-gradient(96deg,var(--org),var(--red));
    box-shadow:0 10px 30px rgba(255,140,43,.48),inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .09s,box-shadow .22s,filter .22s}
  .draw:hover{box-shadow:0 14px 40px rgba(255,77,77,.6);filter:brightness(1.08)}
  .draw:active{transform:scale(.977)}
  .draw:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.25)}
  .row2{display:flex;gap:10px;margin-top:10px}
  .row2 button{flex:1;border:1px solid var(--line);background:rgba(255,140,43,.12);color:var(--text);
    border-radius:13px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:background .2s,transform .09s}
  .row2 button:hover{background:rgba(255,140,43,.26)}
  .row2 button:active{transform:scale(.97)}
  h2{font-size:11.5px;letter-spacing:.18em;color:var(--dim);margin:0 0 9px;font-weight:700}
  h2 .cnt{color:var(--org);letter-spacing:0;font-weight:800;font-size:11px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;min-width:0}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--dim);
    border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;
    letter-spacing:.03em;font-family:inherit;transition:all .16s;user-select:none;
    max-width:100%;overflow-wrap:anywhere;line-height:1.32}
  .chip:hover{border-color:rgba(255,140,43,.75)}
  .chip.on{color:#fff;background:linear-gradient(140deg,rgba(255,140,43,.6),rgba(255,77,77,.3));
    border-color:rgba(255,180,120,.9);box-shadow:0 0 14px rgba(255,140,43,.45)}
  .chip.on.scene{background:linear-gradient(140deg,rgba(94,169,255,.55),rgba(94,169,255,.22));
    border-color:rgba(140,195,255,.9);box-shadow:0 0 14px rgba(94,169,255,.45)}
  .chip.on[data-p="1"]{background:linear-gradient(140deg,rgba(94,194,106,.55),rgba(94,194,106,.22))}
  .chip.on[data-p="3"]{background:linear-gradient(140deg,rgba(255,77,77,.6),rgba(255,77,77,.25))}
  .toggles{display:flex;flex-wrap:wrap;gap:16px;margin-top:13px;padding-top:11px;border-top:1px dashed rgba(255,140,43,.3)}
  .toggles label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);cursor:pointer}
  .toggles input{width:16px;height:16px;accent-color:var(--org);cursor:pointer}
  .hist{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow:auto}
  .hi{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:7px 10px;border-radius:10px;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,140,43,.16)}
  .hi .i{color:var(--dim);font-size:11px;min-width:20px}
  .hi .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hi .tm{color:var(--dim);font-size:11px}
  .hi.eaten{opacity:.55}
  .hi.eaten .nm{text-decoration:line-through}
  .empty{color:var(--dim);font-size:12.5px;text-align:center;padding:12px}
  footer{text-align:center;font-size:11px;color:var(--dim);opacity:.75;margin-top:16px;line-height:1.8}
  kbd{background:rgba(255,140,43,.2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="wrap">
  <header>
    <div class="brand">今天吃什么 · v1.1</div>
    <h1>随机决定器</h1>
    <div class="sub" id="subline">加载中…</div>
  </header>
  <div style="text-align:center;font-size:11px;color:var(--dim);opacity:.7;margin:-8px 0 12px">
    <span id="verInfo">223 种吃法 · 公网版</span></div>

  <div class="stage" id="stage">
    <div class="burst" id="burst"></div>
    <div class="food" id="food">准备就绪</div>
    <div class="meta">
      <span class="chipm" id="type">--</span>
      <span class="chipm scene" id="scene"></span>
      <span class="price" id="price"></span>
    </div>
    <div class="combo" id="combo"></div>
    <div class="tagline" id="tag">点下面的按钮，让命运决定</div>
  </div>

  <button class="draw" id="draw">抽 ！</button>
  <div class="row2">
    <button id="eaten">✅ 吃了这个</button>
    <button id="clear">清空记录</button>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>📍 地点 <span class="cnt" id="locCnt"></span></h2>
    <div class="chips" id="locChips"></div>
    <h2 style="margin-top:16px">👥 场景（几个人）<span class="cnt" id="sceneCnt"></span></h2>
    <div class="chips" id="sceneChips"></div>
    <h2 style="margin-top:16px">🍽️ 餐次 <span class="cnt" id="mealCnt"></span></h2>
    <div class="chips" id="mealChips"></div>
    <h2 style="margin-top:16px">🍜 类型 <span class="cnt" id="typeCnt"></span></h2>
    <div class="chips" id="typeChips"></div>
    <h2 style="margin-top:16px">💰 预算 <span class="cnt" id="priceCnt"></span></h2>
    <div class="chips" id="priceChips"></div>
    <div class="toggles">
      <label><input type="checkbox" id="noRepeat" checked> 最近吃过的先排除</label>
      <label><input type="checkbox" id="sfx" checked> 音效</label>
    </div>
  </div>

  <div class="card">
    <h2>最近抽到 / 吃过</h2>
    <div class="hist" id="hist"><div class="empty">还没有记录～</div></div>
  </div>

  <footer>
    快捷键：<kbd>空格</kbd> 再抽一次　<kbd>Enter</kbd> 标记吃了<br>
    共 <span id="totalNum">0</span> 种吃法 · 数据存在本机 · 祝你不纠结，吃得香 🍚
  </footer>
</div>

    el('priceChips').innerHTML = '';
    PRICES.forEach(function (p, idx) {
      var b = document.createElement('button');
      b.className = 'chip on'; b.textContent = p; b.dataset.price = p; b.dataset.p = String(idx + 1);
      b.onclick = function () {
        var i = state.prices.indexOf(p);
        if (i >= 0) { if (state.prices.length === 1) return; state.prices.splice(i, 1); }
        else state.prices.push(p);
        sfxSoft(); refresh(); save();
      };
      el('priceChips').appendChild(b);
    });
    el('totalNum').textContent = FOODS.length;
    var vi = el('verInfo');
    if (vi) vi.textContent = FOODS.length + ' 种吃法 · ' + TYPES.length + ' 大类 · 地点/场景/餐次/类型/预算 五维筛选 · 公网版';
  }
  function syncChips() {
    document.querySelectorAll('#locChips .chip').forEach(function (b) { b.classList.toggle('on', state.locs.indexOf(b.dataset.loc) >= 0); });
    document.querySelectorAll('#sceneChips .chip').forEach(function (b) { b.classList.toggle('on', state.scenes.indexOf(b.dataset.scene) >= 0); });
    document.querySelectorAll('#mealChips .chip').forEach(function (b) { b.classList.toggle('on', state.meals.indexOf(b.dataset.meal) >= 0); });
    document.querySelectorAll('#typeChips .chip').forEach(function (b) { b.classList.toggle('on', state.types.indexOf(b.dataset.type) >= 0); });
    document.querySelectorAll('#priceChips .chip').forEach(function (b) { b.classList.toggle('on', state.prices.indexOf(b.dataset.price) >= 0); });
    el('noRepeat').checked = state.noRepeat;
    el('sfx').checked = state.sfx;
  }
  function refresh() {
    syncChips();
    var pool = buildPool();
    el('locCnt').textContent = state.locs.join(' ');
    el('sceneCnt').textContent = state.scenes.join(' ');
    el('mealCnt').textContent = state.meals.join(' ');
    el('typeCnt').textContent = state.types.join(' ');
    el('priceCnt').textContent = state.prices.join(' ');
    el('subline').textContent = '共 ' + FOODS.length + ' 种吃法 · 当前可选 ' + pool.length + ' 种';
    if (!pool.length) el('tag').textContent = '当前筛选没有可选项（放宽一点吧）';
  }

  var ROLL_MS = 1400;
  var pendingDone = null;
  function roll(onDone) {
    if (state.rolling) return;
    pendingDone = onDone || null;
    var pool = buildPool();
    if (!pool.length) { el('tag').textContent = '当前筛选没有可选项'; pendingDone = null; return; }
    state.rolling = true;
    ensureAudio();
    if (ac && ac.state === 'suspended') ac.resume();
    el('draw').disabled = true; el('eaten').disabled = true;
    var stage = el('stage');
    stage.classList.add('rolling');
    var t0 = Date.now(), lastTick = 0, settled = false;
    var final = pick() || pool[0];
    function settle() { if (settled) return; settled = true; clearTimeout(guard); show(final); }
    var guard = setTimeout(settle, ROLL_MS + 900);
    function frame() {
      var t = Date.now() - t0;
      if (t < ROLL_MS) {
        var r = pool[Math.floor(Math.random() * pool.length)];
        el('food').textContent = r.n;
        el('type').textContent = r.t;
        el('scene').textContent = '';
        el('price').textContent = '';
        el('combo').textContent = '';
        if (t - lastTick > 70) { lastTick = t; sfxTick(); }
        requestAnimationFrame(frame);
      } else settle();
    }
    requestAnimationFrame(frame);
  }
  function show(f) {
    state.current = f;
    el('food').textContent = f.n;
    el('food').style.color = '#fff';
    el('type').textContent = f.t;
    el('scene').textContent = f.s.join(' / ');
    el('price').textContent = f.p;
    el('price').style.color = PCOLOR[f.p];
    el('combo').textContent = f.c ? ('搭配：' + f.c) : '';
    el('tag').textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    var stage = el('stage');
    stage.classList.remove('hit'); void stage.offsetWidth; stage.classList.add('hit');
    var b = el('burst');
    b.style.background = 'radial-gradient(circle,' + PCOLOR[f.p] + ',rgba(255,255,255,0) 68%)';
    b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
    stage.classList.remove('rolling');
    sfxHit();
    if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
    state.hist.unshift({ n: f.n, t: Date.now(), eaten: false });
    if (state.hist.length > 40) state.hist.pop();
    save(); renderHist(); refresh();
    state.rolling = false;
    el('draw').disabled = false; el('eaten').disabled = false;
    if (pendingDone) { var cb = pendingDone; pendingDone = null; setTimeout(cb, 250); }
  }

  function renderHist() {
    var box = el('hist');
    if (!state.hist.length) { box.innerHTML = '<div class="empty">还没有记录～</div>'; return; }
    box.innerHTML = '';
    state.hist.slice(0, 25).forEach(function (h, i) {
      var d = document.createElement('div');
      d.className = 'hi' + (h.eaten ? ' eaten' : '');
      var dt = new Date(h.t);
      var tm = (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' +
        String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0');
      d.innerHTML = '<span class="i">' + (i + 1) + '</span>' +
        '<span class="nm">' + h.n + '</span>' +
        '<span class="tm">' + tm + '</span>';
      box.appendChild(d);
    });
  }

  function save() {
    try {
      localStorage.setItem(SAVE, JSON.stringify({
        scenes: state.scenes, meals: state.meals, types: state.types, prices: state.prices, locs: state.locs,
        hist: state.hist.slice(0, 40), noRepeat: state.noRepeat, sfx: state.sfx
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(SAVE) || 'null');
      if (!d) return;
      var fit = function (a, pool) { return Array.isArray(a) && a.length ? a.filter(function (x) { return pool.indexOf(x) >= 0; }) : null; };
      var s1 = fit(d.scenes, SCENES); if (s1 && s1.length) state.scenes = s1;
      var s2 = fit(d.meals, MEALS); if (s2 && s2.length) state.meals = s2;
      var s3 = fit(d.types, TYPES); if (s3 && s3.length) state.types = s3;
      var s4 = fit(d.prices, PRICES); if (s4 && s4.length) state.prices = s4;
      var s5 = fit(d.locs, LOCS); if (s5 && s5.length) state.locs = s5;
      if (Array.isArray(d.hist)) state.hist = d.hist;
      state.noRepeat = d.noRepeat !== false;
      state.sfx = d.sfx !== false;
    } catch (e) {}
  }

  el('draw').onclick = function () { roll(); };
  el('eaten').onclick = function () {
    if (!state.current) { el('tag').textContent = '先抽一个再标记呀'; return; }
    for (var i = 0; i < state.hist.length; i++) {
      if (state.hist[i].n === state.current.n && !state.hist[i].eaten) { state.hist[i].eaten = true; break; }
    }
    sfxSoft(); save(); renderHist();
    el('tag').textContent = '✅ 已标记：' + state.current.n + '（下次会先避开）';
  };
  el('clear').onclick = function () {
    if (!confirm('清空历史记录？')) return;
    state.hist = []; state.current = null; save(); renderHist();
    el('food').textContent = '已清空'; el('type').textContent = '--'; el('scene').textContent = '';
    el('price').textContent = ''; el('combo').textContent = '';
    el('tag').textContent = '点下面的按钮，让命运决定';
    sfxSoft();
  };
  el('noRepeat').onchange = function () { state.noRepeat = this.checked; save(); };
  el('sfx').onchange = function () { state.sfx = this.checked; save(); if (state.sfx) { ensureAudio(); sfxSoft(); } };
  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); roll(); }
    else if (e.code === 'Enter') { e.preventDefault(); el('eaten').click(); }
  });
  ['click', 'touchstart', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function once() { ensureAudio(); if (ac && ac.state === 'suspended') ac.resume(); }, { once: true });
  });

  load(); buildChips(); refresh(); renderHist();
  (function autoMeal() {
    var h = new Date().getHours();
    var t = h < 10 ? '早上' : h < 15 ? '中午' : h < 21 ? '晚上' : '深夜';
    el('tag').textContent = '现在是' + t + '，先按餐次筛一筛，或者直接抽 🎯';
  })();
})();
</script>
</body>
</html>
